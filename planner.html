<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudentHub - Study Planner</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f7f5ff;
    color:#211a4c;
}

header{
    height:75px;
    padding:0 7%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:white;

    box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.logo{
    font-size:25px;
    font-weight:800;
    cursor:pointer;
}

.logo span{
    color:#6c3df5;
}

.back{
    padding:11px 20px;
    border:none;
    border-radius:25px;

    background:#6c3df5;
    color:white;

    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:50px auto;
    padding:20px;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h1{
    font-size:42px;
}

.title p{
    color:#777;
    margin-top:10px;
}

.form{
    background:white;
    padding:30px;
    border-radius:20px;

    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;

    border:1px solid #ddd;
    border-radius:10px;

    font-size:15px;
}

.add{
    width:100%;
    padding:14px;

    border:none;
    border-radius:10px;

    background:#6c3df5;
    color:white;

    font-weight:bold;
    cursor:pointer;
}

.schedule{
    margin-top:25px;
}

.item{
    background:#f0ebff;
    padding:18px;
    margin-bottom:12px;

    border-radius:12px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.delete{
    background:#ff5c7a;
    color:white;

    border:none;
    border-radius:8px;

    padding:8px 12px;

    cursor:pointer;
}

</style>

</head>

<body>

<header>

    <div class="logo" onclick="goHome()">
        🎓 Student<span>Hub</span>
    </div>

    <button class="back" onclick="goHome()">
        ← Home
    </button>

</header>


<div class="container">

    <div class="title">

        <h1>📅 Study Planner</h1>

        <p>
            Create and manage your daily study schedule.
        </p>

    </div>


    <div class="form">

        <input
            type="text"
            id="subject"
            placeholder="Enter subject">

        <input
            type="time"
            id="time">

        <button
            class="add"
            onclick="addStudy()">

            + Add Study Plan

        </button>

        <div
            class="schedule"
            id="schedule">

        </div>

    </div>

</div>


<script>

function goHome(){
    window.location.href="index.html";
}

function addStudy(){

    let subject=document.getElementById("subject").value;
    let time=document.getElementById("time").value;

    if(subject==="" || time===""){
        alert("Please enter subject and time.");
        return;
    }

    let item=document.createElement("div");

    item.className="item";

    item.innerHTML=`
        <div>
            <strong>${subject}</strong>
            <br>
            <small>⏰ ${time}</small>
        </div>

        <button
            class="delete"
            onclick="this.parentElement.remove()">

            Delete

        </button>
    `;

    document
    .getElementById("schedule")
    .appendChild(item);

    document.getElementById("subject").value="";
    document.getElementById("time").value="";

}

</script>

</body>
</html>
